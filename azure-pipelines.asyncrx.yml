trigger:
  branches:
    include:
      - main
      - rel/*
  paths:
    include:
      - AsyncRx.NET/*
      - .editorconfig
      - azure-pipelines.asyncrx.yml

pr:
  branches:
    include:
    - main
    - rel/*
  paths:
    include:
      - AsyncRx.NET/*
      - .editorconfig
      - azure-pipelines.asyncrx.yml

stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: windows-latest

    variables:
      BuildConfiguration: Release
      BuildPlatform: Any CPU
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
    - task: UseDotNet@2
      displayName: Use .NET Core 10.x SDK
      inputs:
        version: 10.x
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . nbgv
      displayName: Install NBGV tool

    - script: nbgv cloud -a -p AsyncRx.NET
      displayName: Set Version

    - task: DotNetCoreCLI@2
      displayName: Build AsyncRx.NET.slnx
      inputs:
        command: build
        projects: AsyncRx.NET/AsyncRx.NET.slnx
        arguments: -c $(BuildConfiguration) -p:CreatePackage=true -p:NoPackageAnalysis=true -p:PackageOutputPath=$(Build.ArtifactStagingDirectory)\artifacts

    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . dotnet-reportgenerator-globaltool
      displayName: Install ReportGenerator tool

    - task: DotNetCoreCLI@2
      inputs:
        command: test
        projects: |
          AsyncRx.NET/Tests.Microsoft.Reactive.Testing.Async/Tests.Microsoft.Reactive.Testing.Async.csproj
          AsyncRx.NET/Tests.System.Reactive.Async/Tests.System.Reactive.Async.csproj
          AsyncRx.NET/Tests.System.Reactive.Shared.Rx/Tests.System.Reactive.Shared.Rx.csproj
        arguments: -c $(BuildConfiguration) --no-build
      displayName: Run Unit Tests

    # Once we're ready to stabilize, we'd also add API surface area tests too

    - publish:  AsyncRx.NET/build
      artifact: config
      displayName: Publish signing config

    - publish: $(Build.ArtifactStagingDirectory)\artifacts
      displayName: Publish artifacts
      artifact: BuildPackages

# Rx.NET has an IntegrationTests stage. Consider this once we have tests

- stage: CodeSign
  # In Rx, the condition includes:
  #   succeeded('IntegrationTests')
  condition: not(eq(variables['build.reason'], 'PullRequest'))
  jobs:
  - deployment: CodeSign
    displayName: Code Signing
    pool:
      vmImage: windows-latest
    environment: Code Sign
    variables:
    - group: SignClient Credentials
    strategy:
      runOnce:
        deploy:
          steps:

          - task: UseDotNet@2
            displayName: Use .NET 8.0.x SDK
            inputs:
              version: 8.0.x
              performMultiLevelLookup: true

          - task: DotNetCoreCLI@2
            displayName: Install SignTool tool
            inputs:
              command: custom
              custom: tool
              arguments: install --tool-path . sign --version 0.9.1-beta.24406.1

          - task: AzureCLI@2
            inputs:
              azureSubscription: 'Rx.NET Sign Service Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                .\sign code azure-key-vault `
                "**/*.nupkg" `
                --base-directory "$(Pipeline.Workspace)\BuildPackages" `
                --publisher-name "Reactive Extensions for .NET (.NET Foundation)" `
                --description "AsyncRx.NET" `
                --description-url "https://github.com/dotnet/reactive" `
                --azure-key-vault-url "$(SignKeyVaultUrl)" `
                --azure-key-vault-certificate "$(SignKeyVaultCertificateName)"
            displayName: Sign packages

          - publish: $(Pipeline.Workspace)/BuildPackages
            displayName: Publish Signed Packages
            artifact: SignedPackages
